<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LUMIO portfolio thumbnail</title>
<style>
  :root { --ink:#0e1116; --panel:#161b22; --text:#f2f4f7; --muted:#9aa4b2; --accent:#54e36e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; background: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; color: var(--text); position: relative; }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 86% 18%, rgba(84,227,110,.28), transparent 60%),
      radial-gradient(700px 600px at 62% 110%, rgba(84,227,110,.12), transparent 60%); }
  .grid { position: absolute; inset: 0; opacity: .5;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 64px 64px; mask-image: radial-gradient(900px 700px at 70% 40%, #000, transparent 75%); }
  .left { position: absolute; left: 110px; top: 0; bottom: 0; width: 830px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 56px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; }
  .brand span { font-size: 44px; font-weight: 800; letter-spacing: .14em; }
  h1 { font-size: 82px; white-space: nowrap; line-height: 1.02; letter-spacing: -.035em; font-weight: 800; }
  h1 em { font-style: normal; color: var(--accent); }
  p.sub { margin-top: 36px; font-size: 32px; line-height: 1.4; color: var(--muted); max-width: 640px; }
  .tags { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 14px; }
  .tags span { padding: 11px 20px; border: 1px solid #2a313b; border-radius: 999px; font-size: 22px; font-weight: 600; background: rgba(22,27,34,.8); }
  .phone { position: absolute; width: 360px; height: 760px; border-radius: 56px; background: #05070a; border: 3px solid #2f3742; padding: 14px;
      box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04) inset; overflow: hidden; }
  .phone .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--ink); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .p1 { left: 940px; top: 150px; transform: rotate(-5deg); z-index: 1; }
  .p2 { left: 1190px; top: 120px; transform: rotate(5deg); z-index: 2; }
  .tagline { position: absolute; right: 70px; bottom: 44px; font-size: 22px; color: var(--muted); letter-spacing: .04em; }
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="assets/logo.svg" alt=""><span>LUMIO</span></div>
    <h1>Less scrolling.<br><em>More understanding.</em></h1>
    <p class="sub">One 15-minute lesson a day from the world's classic books, saved to a notebook you keep.</p>
    <div class="tags"><span>Product &amp; UX</span><span>React PWA</span><span>Supabase</span><span>Grounded AI</span></div>
  </div>
  <div class="phone p1"><div class="screen"><img src="screens/home-dark.png" alt=""></div></div>
  <div class="phone p2"><div class="screen"><img src="screens/lesson-dark.png" alt=""></div></div>
</body></html>
