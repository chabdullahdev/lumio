<!doctype html>
<!--
  Source for web/og-image.png (1200x630, the social share card).
  Regenerate: render this page at exactly 1200x630 (see docs in web/README.md).
  Uses the original artwork from public/: the header logo and the app icon.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0e1116;
    color: #f2f4f7;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(520px 520px at 905px 300px, rgba(84, 227, 110, .30), transparent 70%),
      radial-gradient(900px 500px at 0% 100%, rgba(84, 227, 110, .07), transparent 70%);
  }
  .border { position: absolute; inset: 0; border: 1px solid #232a33; }
  .logo { position: absolute; left: 72px; top: 64px; height: 46px; }
  .copy { position: absolute; left: 72px; top: 178px; width: 700px; }
  .tag { font-size: 22px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #54e36e; margin-bottom: 22px; }
  h1 { font-size: 84px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 800; }
  h1 em { font-style: normal; color: #54e36e; }
  .sub { margin-top: 26px; font-size: 30px; line-height: 1.4; color: #9aa4b2; max-width: 640px; }
  .chip {
    position: absolute; left: 72px; bottom: 56px;
    display: flex; align-items: center; gap: 14px;
    font-size: 24px; color: #9aa4b2;
  }
  .chip b { color: #f2f4f7; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #54e36e; }
  .icon-wrap { position: absolute; left: 765px; top: 160px; width: 280px; height: 280px; }
  .icon-wrap img { width: 280px; height: 280px; display: block; border-radius: 66px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
  .card {
    position: absolute; left: 700px; top: 470px; width: 410px;
    background: #161b22; border: 1px solid #232a33; border-radius: 18px;
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
    font-size: 21px; color: #cdd3dc;
  }
  .card .pill { font-size: 16px; font-weight: 700; color: #54e36e; background: rgba(84,227,110,.14); padding: 5px 12px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="border"></div>
  <img class="logo" src="../public/LUMIO%20header%20logo.svg" alt="LUMIO">
  <div class="copy">
    <div class="tag">Less scrolling. More understanding.</div>
    <h1>Learn something <em>real</em>, every day.</h1>
    <p class="sub">One focused 15-minute reading lesson a day, from classic books.</p>
  </div>
  <div class="icon-wrap"><img src="../public/LUMIO%20app%20icon.svg" alt=""></div>
  <div class="card"><span class="pill">History</span><span>15 min read · 3-day streak</span></div>
  <div class="chip"><span class="dot"></span><b>Free on Android</b> · lumio.mabdullahshahzad.com</div>
</body>
</html>
